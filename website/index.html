<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Global Web Hosting</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #071b38, #0078d4);
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 42px;
        }

        .card {
            background: white;
            color: #123;
            margin: 30px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 15px;
        }

        .status {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Azure Global Web Hosting</h1>
        <p>Custom DNS + Traffic Manager + Azure Virtual Machines</p>
    </header>

    <div class="card">
        <h2>Website is Running!</h2>
        <p>Hosted using Apache on Azure Linux VM.</p>
        <p class="status">Server Status: ONLINE</p>
        <p>Powered by Microsoft Azure</p>
    </div>
</body>
</html>
